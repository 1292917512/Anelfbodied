name: Desktop client

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm run format:check
      - run: pnpm exec playwright test
      - run: pnpm exec electron-builder --dir
      - name: Verify packaged desktop
        shell: pwsh
        run: |
          $env:EMBODIED_EXECUTABLE = "$env:GITHUB_WORKSPACE/release/win-unpacked/Embodied.exe"
          pnpm exec playwright test
      - name: Build installer
        run: pnpm exec electron-builder --win nsis --prepackaged release/win-unpacked --publish never
      - name: Verify install, upgrade and uninstall
        run: pnpm run test:installer
      - uses: actions/upload-artifact@v4
        with:
          name: Embodied-Windows-installer
          path: release/Embodied-Setup-*.exe
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-results
          path: test-results
          retention-days: 7
